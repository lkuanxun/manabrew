proxy_cache_path /var/cache/scryfall levels=1:2 keys_zone=scryfall:32m max_size=10g inactive=365d use_temp_path=off;

server {
    listen 80;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    set $upstream https://cards.scryfall.io;

    location ~ ^/(small|normal|large|png|art_crop|border_crop)/(front|back)/[0-9a-f]/[0-9a-f]/[0-9a-f-]+\.(jpg|png)$ {
        proxy_pass $upstream$uri;
        proxy_pass_request_headers off;
        proxy_set_header Host cards.scryfall.io;
        proxy_ssl_server_name on;
        proxy_ssl_name cards.scryfall.io;
        proxy_cache scryfall;
        proxy_cache_key $uri;
        proxy_cache_valid 200 365d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        return 404;
    }
}
